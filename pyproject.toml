[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchtruth"
version = "0.1.0"
description = "A hardware build verifier that refuses impossible builds, with the physics and the cost of the fix."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "BenchTruth contributors" }]
keywords = ["hardware", "esp32", "constraint-solver", "arduino", "meta-ai", "hackathon"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "jsonschema>=4.20",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/your-org/benchtruth"

[tool.setuptools]
packages = ["benchtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
