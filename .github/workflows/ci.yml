name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The refusal demo, the eval and the unit tests must never need a key.
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate the data contracts
        run: python scripts/validate_db.py

      - name: Solver eval (20 conflict cases)
        run: python eval/run_eval.py

      - name: Unit tests
        run: python tests/run_tests.py

      - name: Byte-compile check
        run: python -m compileall -q benchtruth eval scripts tests
